<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Yarndings+12&display=swap"
      rel="stylesheet"
    />
    <title>Glide</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <p>Glide</p>
      </div>

      <ul>
        <li><a href="#">product</a></li>
        <li><a href="#">enterprise</a></li>
        <li><a href="#">customers</a></li>
        <li><a href="#">resources</a></li>
        <li><a href="#">pricing</a></li>
      </ul>

      <div class="btn-container">
        <button class="trans-btn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button class="trans-btn">log in</button>
        <button class="trans-btn">contact sales</button>
        <button class="black-btn">Start for free</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="left">
          <div>
            <p class="littlep">Inventory Management Software</p>
            <h1>Build custom inventory management software with AI</h1>
            <p class="bigp">
              Stay ahead of demand, prevent stockouts, and streamline
              fulfillment with AI-powered software tailored to how you move
              inventory.
            </p>
            <div>
              <textarea
                placeholder="Describe what you want to build..."
              ></textarea>
              <div class="btn-container">
                <button class="trans-btn">
                  <i class="fa-solid fa-paperclip"></i> upload sheet
                </button>
                <button class="black-btn">build app</button>
              </div>
            </div>
          </div>
        </div>

        <div class="right">
          <img src="/IMG-20261027-WA0007.jpg" alt="Glide image" />
        </div>
      </section>
    </main>
  </body>
</html>
